services:
  - type: web
    name: stackcart-events
    runtime: node
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build --workspace client
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://stack-cart-events.vercel.app
